<!DOCTYPE html>
<html>
<head>
  <title>Unified Multi-Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #controls {
      background: #1a1a1a;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #controls input {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      width: 260px;
    }

    #controls button {
      background: #3ea6ff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    #controls button:hover { background: #65b8ff; }
    #controls button.secondary { background: #444; color: #fff; }
    #controls button.secondary:hover { background: #555; }

    .layout-btns {
      display: flex;
      gap: 4px;
      margin-left: 8px;
    }

    .layout-btns button {
      background: #333;
      color: #ccc;
      font-size: 12px;
      padding: 5px 10px;
    }

    .layout-btns button.active {
      background: #3ea6ff;
      color: #000;
    }

    #chat-container {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* Horizontal */
    #chat-container.layout-horizontal {
      display: flex;
      flex-direction: row;
    }

    #chat-container.layout-horizontal .chat-wrapper {
      border-right: 1px solid #333;
      border-bottom: none;
    }

    #chat-container.layout-horizontal .chat-wrapper:last-child {
      border-right: none;
    }

    /* Vertical */
    #chat-container.layout-vertical {
      display: flex;
      flex-direction: column;
    }

    #chat-container.layout-vertical .chat-wrapper {
      border-right: none;
      border-bottom: 1px solid #333;
      min-height: 0;
    }

    #chat-container.layout-vertical .chat-wrapper:last-child {
      border-bottom: none;
    }

    /* Grid */
    #chat-container.layout-grid {
      display: grid;
      gap: 0;
      height: 100%;
    }

    #chat-container.layout-grid .chat-wrapper {
      border-right: 1px solid #333;
      border-bottom: 1px solid #333;
      min-height: 0;
      min-width: 0;
    }

    .chat-wrapper {
      display: flex;
      flex-direction: column;
      position: relative;
      background: #0f0f0f;
      min-width: 0;
      min-height: 0;
    }

    #chat-container.layout-horizontal .chat-wrapper,
    #chat-container.layout-vertical .chat-wrapper {
      flex: 1 1 0;
    }

    .chat-header {
      background: #222;
      padding: 5px 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      gap: 6px;
    }

    .chat-header .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-header button {
      background: transparent;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .chat-header button:hover { color: #fff; background: #444; }
    .chat-header button.remove:hover { color: #ff5555; }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0f0f0f;
      min-height: 0;
    }

    .empty-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
      height: 100%;
      grid-column: 1 / -1;
    }

    .twitch-fallback {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0f0f0f;
      color: #aaa;
      font-size: 13px;
      text-align: center;
      padding: 20px;
      min-height: 0;
    }

    .twitch-fallback button {
      background: #9146ff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="controls">
    <input id="urlInput" placeholder="YouTube ID/URL  or  Twitch channel name/URL" />
    <button onclick="addChat()">Add Chat</button>
    <button class="secondary" onclick="clearAll()">Clear All</button>

    <div class="layout-btns">
      <button id="btn-horizontal" onclick="setLayout('horizontal')">Horizontal</button>
      <button id="btn-vertical" onclick="setLayout('vertical')">Vertical</button>
      <button id="btn-grid" onclick="setLayout('grid')">Grid</button>
      <button id="btn-auto" onclick="setLayout('auto')">Auto</button>
    </div>

    <span style="margin-left:auto; font-size:13px; color:#888;" id="countLabel">0 chats</span>
  </div>

  <div id="chat-container" class="layout-horizontal"></div>

  <script>
    let chats = [];
    let currentLayout = localStorage.getItem('multiChatLayout') || 'auto';

    function extractInfo(input) {
      input = input.trim();
      if (!input) return null;

      // YouTube
      let ytMatch = input.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        return {
          type: 'youtube',
          id: ytMatch[1],
          title: null,
          label: 'YT · ' + ytMatch[1] + ' (loading…)'
        };
      }
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return {
          type: 'youtube',
          id: input,
          title: null,
          label: 'YT · ' + input + ' (loading…)'
        };
      }

      // Twitch
      let twMatch = input.match(/(?:twitch\.tv\/|player\.twitch\.tv\/\?channel=)([a-zA-Z0-9_]{3,25})/i);
      if (twMatch) {
        return {
          type: 'twitch',
          id: twMatch[1].toLowerCase(),
          label: 'TW · ' + twMatch[1]
        };
      }
      if (/^[a-zA-Z0-9_]{3,25}$/i.test(input)) {
        return {
          type: 'twitch',
          id: input.toLowerCase(),
          label: 'TW · ' + input
        };
      }

      alert('Could not recognise a YouTube video ID/URL or Twitch channel');
      return null;
    }

    function truncate(str, max = 42) {
      if (!str) return '';
      return str.length > max ? str.slice(0, max - 1) + '…' : str;
    }

    async function fetchYouTubeTitle(chat) {
      try {
        const url = `https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + chat.id)}&format=json`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('oEmbed failed');
        const data = await res.json();
        chat.title = data.title || null;
        chat.label = chat.title
          ? `YT · ${truncate(chat.title)}`
          : `YT · ${chat.id}`;
      } catch (e) {
        chat.label = `YT · ${chat.id}`;
      }
      render();
    }

    function buildSrc(info) {
      if (info.type === 'youtube') {
        return `https://www.youtube.com/live_chat?v=${info.id}&embed_domain=${location.hostname || 'localhost'}&dark_theme=1`;
      }
      if (info.type === 'twitch') {
        return `https://www.twitch.tv/embed/${info.id}/chat?parent=${location.hostname || 'localhost'}&darkpopout`;
      }
      return '';
    }

    function openTwitchPopout(channel) {
      window.open(
        `https://www.twitch.tv/popout/${channel}/chat?popout=`,
        `twitch-${channel}`,
        'width=400,height=700'
      );
    }

    function getGridColumns(count) {
      if (count <= 1) return 1;
      if (count <= 2) return 2;
      if (count <= 4) return 2;
      if (count <= 6) return 3;
      return 4;
    }

    // ---------- Hash-based URL sharing (GitHub Pages friendly) ----------
    function updateURL() {
      if (chats.length === 0) {
        // Clear the hash
        history.replaceState(null, '', location.pathname + location.search);
        return;
      }

      const list = chats.map(c => {
        const prefix = c.type === 'youtube' ? 'yt' : 'tw';
        return `${prefix}:${c.id}`;
      }).join(',');

      const newUrl = location.pathname + location.search + '#chats=' + list;
      history.replaceState(null, '', newUrl);
    }

    function loadFromURL() {
      const hash = location.hash;
      if (!hash.startsWith('#chats=')) return;

      const chatsParam = hash.slice(7); // remove "#chats="
      if (!chatsParam) return;

      chatsParam.split(',').forEach(item => {
        item = item.trim();
        if (!item) return;

        const colon = item.indexOf(':');
        if (colon === -1) return;

        const typeShort = item.slice(0, colon).toLowerCase();
        const id = item.slice(colon + 1).trim();
        if (!id) return;

        let info = null;
        if (typeShort === 'yt' || typeShort === 'youtube') {
          if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
            info = {
              type: 'youtube',
              id: id,
              title: null,
              label: 'YT · ' + id + ' (loading…)'
            };
          }
        } else if (typeShort === 'tw' || typeShort === 'twitch') {
          if (/^[a-zA-Z0-9_]{3,25}$/i.test(id)) {
            info = {
              type: 'twitch',
              id: id.toLowerCase(),
              label: 'TW · ' + id
            };
          }
        }

        if (info && !chats.some(c => c.type === info.type && c.id === info.id)) {
          chats.push(info);
          if (info.type === 'youtube') {
            fetchYouTubeTitle(info);
          }
        }
      });
    }

    function applyLayoutClass() {
      const container = document.getElementById('chat-container');
      let effective = currentLayout;

      if (currentLayout === 'auto') {
        const width = window.innerWidth;
        const count = chats.length;

        if (count === 0) {
          effective = 'horizontal';
        } else if (width < 800) {
          effective = 'vertical';
        } else if (count >= 4 && width >= 1100) {
          effective = 'grid';
        } else if (count >= 3 && width < 1100) {
          effective = 'vertical';
        } else {
          effective = 'horizontal';
        }
      }

      container.classList.remove('layout-horizontal', 'layout-vertical', 'layout-grid');
      container.classList.add('layout-' + effective);

      if (effective === 'grid') {
        const cols = getGridColumns(chats.length);
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        container.style.gridTemplateRows = `repeat(${Math.ceil(chats.length / cols) || 1}, 1fr)`;
      } else {
        container.style.gridTemplateColumns = '';
        container.style.gridTemplateRows = '';
      }

      ['horizontal', 'vertical', 'grid', 'auto'].forEach(mode => {
        const btn = document.getElementById('btn-' + mode);
        if (btn) btn.classList.toggle('active', currentLayout === mode);
      });
    }

    function setLayout(mode) {
      currentLayout = mode;
      localStorage.setItem('multiChatLayout', mode);
      applyLayoutClass();
    }

    function render() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';

      if (chats.length === 0) {
        container.innerHTML = '<div class="empty-msg">Add YouTube or Twitch chats above</div>';
      } else {
        chats.forEach((chat, index) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'chat-wrapper';

          const header = document.createElement('div');
          header.className = 'chat-header';

          let headerButtons = `<button class="remove" title="Remove" onclick="removeChat(${index})">✕</button>`;
          if (chat.type === 'twitch') {
            headerButtons = `
              <button title="Open real Twitch popout" onclick="openTwitchPopout('${chat.id}')">↗ Popout</button>
              ${headerButtons}`;
          }

          const fullTitle = chat.title
            ? `${chat.title} (${chat.id})`
            : chat.id;

          header.innerHTML = `
            <span class="label" title="${fullTitle.replace(/"/g, '&quot;')}">${chat.label}</span>
            ${headerButtons}
          `;

          wrapper.appendChild(header);

          if (chat.type === 'twitch') {
            const fallback = document.createElement('div');
            fallback.className = 'twitch-fallback';
            fallback.innerHTML = `
              <div>Twitch often blocks embeds<br>(especially in Firefox)</div>
              <button onclick="openTwitchPopout('${chat.id}')">Open Twitch Chat Popout</button>
            `;
            wrapper.appendChild(fallback);

            const iframe = document.createElement('iframe');
            iframe.src = buildSrc(chat);
            iframe.style.display = 'none';
            wrapper.appendChild(iframe);
          } else {
            const iframe = document.createElement('iframe');
            iframe.src = buildSrc(chat);
            iframe.allow = 'autoplay; encrypted-media';
            wrapper.appendChild(iframe);
          }

          container.appendChild(wrapper);
        });
      }

      document.getElementById('countLabel').textContent =
        chats.length + (chats.length === 1 ? ' chat' : ' chats');

      applyLayoutClass();
      updateURL();
    }

    function addChat() {
      const input = document.getElementById('urlInput');
      const info = extractInfo(input.value);
      if (!info) return;

      if (chats.some(c => c.type === info.type && c.id === info.id)) {
        alert('That chat is already open');
        return;
      }

      chats.push(info);
      input.value = '';
      render();

      if (info.type === 'youtube') {
        fetchYouTubeTitle(info);
      }
    }

    function removeChat(index) {
      chats.splice(index, 1);
      render();
    }

    function clearAll() {
      if (chats.length && confirm('Remove all chats?')) {
        chats = [];
        render();
      }
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addChat();
    });

    window.addEventListener('resize', () => {
      if (currentLayout === 'auto') applyLayoutClass();
    });

    // Initialise
    loadFromURL();
    setLayout(currentLayout);
    render();
  </script>
</body>
</html>
